services:
  postgres:
    image: postgres:16
    container_name: mdm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mdm_db
      POSTGRES_USER: mdm_user
      POSTGRES_PASSWORD: mdm_password_2026
    ports:
      - "5433:5432"
    volumes:
      - mdm_postgres_clean_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdm_user -d mdm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mdm_postgres_clean_data:
    name: mdm_postgres_clean_data
